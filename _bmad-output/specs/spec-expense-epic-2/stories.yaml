- id: "1"
  title: Agent scaffold, entry point, and provider switch
  description: >-
    Implements CAP-1 and CAP-2: a create_agent-based agent wired to
    mcp/expense_server.py's five tools via langchain-mcp-adapters, MLflow
    tracing (sqlite:///mlflow.db, expense-reviewer experiment), and a
    cases/expense/review_claim.py entry point. Gemini/Groq switch via
    PROVIDER/MODEL env vars, mirroring the triage agent. No policy
    precedence logic yet -- that's Story 2.

- id: "2"
  title: Precedence-order decision engine (CAP-3 + CAP-4)
  description: >-
    Implements CAP-3 and CAP-4 together as one deterministic function
    (cases/expense/policy.py) -- POLICY.md's fixed precedence (3, 5.1,
    1.2, 4.1, limits 2/6, 1.3), same-day meal/ground aggregation, and
    cross-claim duplicate detection. Originally two stories; consolidated
    at build time once it was clear the aggregation and duplicate checks
    are steps inside the precedence chain, not a separate pass over it.
    Local Python, not a new MCP tool -- verified against all 119 rows of
    eval/labelled.csv, 100% exact match.

- id: "3"
  title: Wire the decision engine into the agent
  description: >-
    Replaces Story 1's unvalidated scaffold output with real decisions:
    the agent calls policy.decide_line_item as a local tool for every
    line item (fetching context via Epic 1's MCP tools, calling
    get_policy_limits per line item's own city -- not the employee's
    home city), records each result via record_decision, and produces a
    human-readable explanation per decision for Epic 3's judge. This is
    what makes CAP-1's success signal (matches eval/labelled.csv) true
    end-to-end, not just at the policy.py unit level.

- id: "4"
  title: Held-for-approval marking
  description: >-
    Implements CAP-5: flag every decision==approve line item over $500 as
    held. A pure function of decision+amount -- no new database state,
    no payout logic, no blocking prompt.

- id: "5"
  title: Prompt-injection resistance
  description: >-
    Implements CAP-6: verify the agent decides purely on POLICY.md fields
    (amount/date/category/receipt) even when purpose/description/merchant
    contain embedded instructions, mirroring triage Epic 2's T-1099 case.
